name: Forest Horror — Kit 03 visual

on:
  push:
    branches:
      - feat/kit03-accesos-visuales-marco-20261107
  pull_request:
    paths:
      - juego/assets/fh-architecture-editor-catalog.js
      - juego/assets/fh-architecture-skins.js
      - juego/assets/fh-architecture-skins.test.js
      - juego/assets/fh-architecture-strings.js
      - forest-horror/biblioteca/arquitectura/**
      - .github/workflows/kit03-visual.yml

permissions:
  contents: write

jobs:
  assets-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar generadores reproducibles
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 Pillow==12.3.0 trimesh==4.11.1
      - name: Crear únicamente los cuatro GLB, texturas y miniaturas nuevos
        run: |
          python forest-horror/biblioteca/arquitectura/generar_kit_electronico.py
          python forest-horror/biblioteca/arquitectura/generar_miniaturas_electronica.py
          python - <<'PY'
          import json,struct
          from pathlib import Path
          root=Path('forest-horror/biblioteca/arquitectura')
          catalog=json.loads((root/'catalogo_arquitectura.json').read_text())
          new=catalog['architecture'][-4:]
          assert len(catalog['architecture'])==12 and len(new)==4
          assert all(x['geometryRole']=='visual-only' for x in new)
          for item in new:
            glb=(root/item['glb']).read_bytes()
            assert glb[:4]==b'glTF'
            n=struct.unpack_from('<I',glb,12)[0]
            data=json.loads(glb[20:20+n])
            assert set(item['nodes']).issubset({n.get('name') for n in data['nodes']})
            assert all(s.get('magFilter')==9728 for s in data.get('samplers',[]))
            assert (root/item['thumbnail']).stat().st_size>2000
            assert (root/'texturas'/(item['id']+'.png')).stat().st_size>500
          print('PASS: cuatro GLB, 4 texturas y 4 miniaturas')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regresión del editor y las puertas dobles
        run: node --test juego/assets/fh-architecture-skins.test.js
      - name: Publicar sólo nuevos recursos del Kit 03 en esta rama
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for id in puerta_electronica_reja puerta_electronica_opaca teclado_pin lector_tarjeta; do
            git add "forest-horror/biblioteca/arquitectura/modelos_glb/$id.glb"
            git add "forest-horror/biblioteca/arquitectura/miniaturas/$id.png"
            git add "forest-horror/biblioteca/arquitectura/texturas/$id.png"
          done
          git add forest-horror/biblioteca/arquitectura/hoja_miniaturas_electronica.png
          if ! git diff --cached --quiet; then
            git commit -m 'build(architecture): publish Kit 03 GLB textures and thumbnails'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Verificar assets versionados en PR
        if: github.event_name == 'pull_request'
        run: |
          for id in puerta_electronica_reja puerta_electronica_opaca teclado_pin lector_tarjeta; do
            test -f "forest-horror/biblioteca/arquitectura/modelos_glb/$id.glb"
            test -f "forest-horror/biblioteca/arquitectura/miniaturas/$id.png"
            test -f "forest-horror/biblioteca/arquitectura/texturas/$id.png"
          done
          git diff --exit-code -- forest-horror/biblioteca/arquitectura/modelos_glb/ forest-horror/biblioteca/arquitectura/miniaturas/ forest-horror/biblioteca/arquitectura/texturas/
