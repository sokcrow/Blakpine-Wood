name: Forest Horror — hotfix arquitectura 01+02

on:
  push:
    branches:
      - fix/hotfix-puertas-perillas-dobles-20261105
  pull_request:
    paths:
      - index.html
      - juego/assets/fh-architecture-skins.js
      - juego/assets/fh-architecture-skins.test.js
      - forest-horror/biblioteca/arquitectura/**
      - .github/workflows/architecture-kit.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generar los ocho GLB y atlas con dependencias fijadas
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.5 Pillow==12.3.0 trimesh==4.11.1
          python forest-horror/biblioteca/arquitectura/generar_kit.py
          python forest-horror/biblioteca/arquitectura/generar_kit_cristal.py
          python forest-horror/biblioteca/arquitectura/generar_miniaturas.py
          python forest-horror/biblioteca/arquitectura/generar_miniaturas_cristal.py
          cd forest-horror/biblioteca/arquitectura
          sha256sum --check hotfix_perillas.sha256
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pruebas de integración del motor y el editor
        run: node --test juego/assets/*.test.js
      - name: Comprobar que nunca se agregan GLB dobles
        run: |
          test ! -f forest-horror/biblioteca/arquitectura/modelos_glb/puerta_cristal_doble.glb
          test ! -f forest-horror/biblioteca/arquitectura/modelos_glb/puerta_comercial_panel_lateral.glb
      - name: Publicar recursos verificados solamente en la rama del hotfix
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forest-horror/biblioteca/arquitectura/modelos_glb/ forest-horror/biblioteca/arquitectura/texturas/ forest-horror/biblioteca/arquitectura/miniaturas/ forest-horror/biblioteca/arquitectura/hoja_miniaturas_cristal.png forest-horror/biblioteca/arquitectura/reporte_topologia_arquitectura.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(architecture): actualizar GLB y texturas verificadas del hotfix'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: La rama debe contener los recursos reproducibles
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code -- forest-horror/biblioteca/arquitectura/modelos_glb/ forest-horror/biblioteca/arquitectura/texturas/ forest-horror/biblioteca/arquitectura/miniaturas/
