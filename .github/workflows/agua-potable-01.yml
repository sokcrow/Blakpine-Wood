name: Agua potable 01
on:
  push:
    paths:
      - "juego/assets/fh-water-potable.js"
      - "juego/assets/fh-water-potable.test.js"
      - "juego/assets/fh-services-core.js"
      - ".github/workflows/agua-potable-01.yml"
  pull_request:
    paths:
      - "juego/assets/fh-water-potable.js"
      - "juego/assets/fh-water-potable.test.js"
      - "juego/assets/fh-services-core.js"
      - ".github/workflows/agua-potable-01.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test juego/assets/fh-water-potable.test.js
      - run: node --test tests/fh-services-core.test.js
