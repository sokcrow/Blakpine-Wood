name: RAVEN/OS — energía y HUD móvil

on:
  pull_request:
    paths:
      - 'juego/assets/fh-computer.js'
      - 'juego/assets/fh-computer-strings.js'
      - 'juego/assets/fh-computer.test.js'
      - 'juego/assets/fh-terminal.html'
      - '.github/workflows/raven-os.yml'
  push:
    branches: [main]
    paths:
      - 'juego/assets/fh-computer.js'
      - 'juego/assets/fh-computer-strings.js'
      - 'juego/assets/fh-computer.test.js'
      - 'juego/assets/fh-terminal.html'
      - '.github/workflows/raven-os.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pruebas de computadoras RAVEN/OS
        run: node juego/assets/fh-computer.test.js
