name: Importar sprites iniciales de Sombras

on:
  push:
    branches:
      - feature/sombras-sprites-iniciales
    paths:
      - .github/workflows/import-shadow-sprites.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar y validar originales de Imgur
        shell: bash
        run: |
          set -euo pipefail
          download_sprite() {
            local id="$1" folder="$2" mime="" extension="" temp
            mkdir -p "$folder"
            temp="$(mktemp)"
            for url_ext in png jpg jpeg webp; do
              if ! curl -fsSL --retry 2 --connect-timeout 10 --max-time 35 \
                --max-filesize 15000000 -A 'Mozilla/5.0 (compatible; Blakpine-Wood-AssetImport/1.0)' \
                "https://i.imgur.com/${id}.${url_ext}" -o "$temp"; then
                continue
              fi
              mime="$(file --brief --mime-type "$temp")"
              case "$mime" in
                image/png) extension=png;;
                image/jpeg) extension=jpg;;
                image/webp) extension=webp;;
                *) continue;;
              esac
              [[ "$(wc -c < "$temp")" -gt 100 ]] || continue
              [[ "$(wc -c < "$temp")" -lt 15000000 ]] || continue
              break
            done
            if [[ -z "$extension" ]]; then
              echo "::error::No se pudo descargar el sprite original ${id} de Imgur"
              rm -f "$temp"
              return 1
            fi
            cp "$temp" "$folder/idle.$extension"
            rm -f "$temp"
            echo "Descargado $folder/idle.$extension ($mime)"
          }
          download_sprite 'EtOrF6z' 'juego/assets/enemigos/Sombras/el_alto'
          download_sprite 'T0lfzmL' 'juego/assets/enemigos/Sombras/la_nina'
      - name: Guardar los PNG/JPG/WebP originales en la rama de trabajo
        shell: bash
        run: |
          set -euo pipefail
          git add juego/assets/enemigos/Sombras
          if git diff --cached --quiet; then
            echo "Los recursos ya están importados."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'assets: importar sprites originales de El Alto y La Niña'
          git push
