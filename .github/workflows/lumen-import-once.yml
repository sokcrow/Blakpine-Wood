name: Importar arte original LUMEN (una sola vez)
on:
  push:
    paths:
      - '.github/workflows/lumen-import-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-originals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Descargar y validar originales
        shell: bash
        run: |
          python -m pip install --quiet pillow requests
          python - <<'PY'
          import io, os
          from pathlib import Path
          import requests
          from PIL import Image
          sources = [
              ("UBTsf5O","mode-blakpine.webp"),
              ("8xZm7SO","mode-dnd.webp"),
              ("SQSSary","mode-moon.webp"),
              ("c0Cf2Yc","lumen-logo.webp"),
          ]
          output = Path("portal/assets")
          output.mkdir(parents=True, exist_ok=True)
          for image_id, filename in sources:
              result = None
              failures = []
              for ext in (".png", ".jpg", ".jpeg", ".webp"):
                  url = f"https://i.imgur.com/{image_id}{ext}"
                  try:
                      r = requests.get(url, timeout=35, headers={"User-Agent":"Mozilla/5.0 LUMEN-asset-import"}, allow_redirects=True)
                      r.raise_for_status()
                      im = Image.open(io.BytesIO(r.content))
                      im.load()
                      if im.width < 1000 or im.height < 800:
                          raise ValueError(f"wrong resolution {im.size}")
                      result = im
                      break
                  except Exception as error:
                      failures.append(f"{ext}: {type(error).__name__}: {error}")
              if result is None:
                  raise RuntimeError(f"Unable to obtain {image_id}: {failures}")
              if result.mode in ("RGBA", "LA") or "transparency" in result.info:
                  result = result.convert("RGBA")
                  result.save(output / filename, "WEBP", lossless=True, method=6)
              else:
                  result = result.convert("RGB")
                  result.save(output / filename, "WEBP", quality=95, method=6)
              print(filename, result.size, (output / filename).stat().st_size)
          PY
      - name: Confirmar persistencia en main y eliminar tarea puntual
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/lumen-import-once.yml
          git add portal/assets/mode-blakpine.webp portal/assets/mode-dnd.webp portal/assets/mode-moon.webp portal/assets/lumen-logo.webp
          git commit -m "assets(lumen): sustituir miniaturas por arte original de Imgur"
          git push origin HEAD:main
