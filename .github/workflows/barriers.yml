name: Blakpine-Wood — barreras metálicas

on:
  pull_request:
    paths:
      - 'index.html'
      - 'juego/assets/fh-barriers*.js'
      - '.github/workflows/barriers.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis de los adaptadores
        run: |
          node --check juego/assets/fh-barriers.js
          node --check juego/assets/fh-barriers-strings.js
          node --check juego/assets/fh-barriers-editor.js
          node --check juego/assets/fh-barriers-engine-hook.js
      - name: Pruebas de barandillas, malla y motor embebido
        run: node --test juego/assets/fh-barriers.test.js
