name: Clima y estaciones — pruebas
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'juego/assets/fh-weather-*'
      - 'juego/assets/fh-natural-light*'
      - 'juego/assets/fh-phone*'
      - '.github/workflows/weather.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'juego/assets/fh-weather-*'
      - 'juego/assets/fh-natural-light*'
      - 'juego/assets/fh-phone*'
      - '.github/workflows/weather.yml'
permissions:
  contents: read
jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clima, iluminación y arranque del 3D
        run: node --test juego/assets/fh-weather-core.test.js juego/assets/fh-weather-renderer.test.js juego/assets/fh-natural-light.test.js juego/assets/fh-preview-boot.test.js juego/assets/fh-phone.test.js
