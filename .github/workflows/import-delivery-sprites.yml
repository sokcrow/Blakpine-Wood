name: Import delivery NPC sprites from Imgur
on:
  push:
    branches:
      - feat/import-delivery-sprites
    paths:
      - '.github/workflows/import-delivery-sprites.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify eight original images
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          import io, os, subprocess, tempfile
          from PIL import Image
          sprites = {
              'delivery_normal_idle.png':'5zbBkTH',
              'delivery_normal_walk.png':'kf7Pnkg',
              'delivery_normal_thinking.png':'fhm07cL',
              'delivery_door_idle.png':'z1Eb51c',
              'delivery_door_greeting.png':'6hO27P4',
              'delivery_door_signature.png':'1pG8Kko',
              'delivery_door_cash.png':'EyiVbyZ',
              'delivery_door_card.png':'AyKZ0UZ',
          }
          os.makedirs('juego/assets/npc',exist_ok=True)
          for name,ident in sprites.items():
              got=None
              for ext in ['png','webp','jpg','jpeg']:
                  url=f'https://i.imgur.com/{ident}.{ext}'
                  with tempfile.NamedTemporaryFile() as tmp:
                      command=['curl','--fail','--location','--silent','--show-error','--retry','2','--retry-delay','1','--max-time','20',
                               '-A','Mozilla/5.0',url,'--output',tmp.name]
                      result=subprocess.run(command,capture_output=True,text=True)
                      if result.returncode != 0: continue
                      content=open(tmp.name,'rb').read()
                      if len(content)<100: continue
                      try:
                          img=Image.open(io.BytesIO(content)); img.verify()
                          img=Image.open(io.BytesIO(content)); img.load()
                          if img.width<10 or img.height<10: continue
                          got=img
                          print(f'{name}: retrieved {url} ({len(content)} bytes, {img.format}, {img.size}, {img.mode})')
                          break
                      except Exception:
                          continue
              if got is None: raise SystemExit('FAIL: Cannot retrieve valid Imgur asset '+ident)
              got.convert('RGBA').save('juego/assets/npc/'+name,format='PNG',optimize=True)
          print('PASS: all 8 images downloaded to juego/assets/npc/')
          PY
      - name: Commit imported images to the branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add juego/assets/npc/delivery_*.png
          git diff --cached --quiet && exit 0
          git commit -m 'assets: import eight delivery NPC sprites from Imgur'
          git push
