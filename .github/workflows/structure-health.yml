name: Forest Horror — PG estructurales

on:
  push:
    branches:
      - feat/pg-puertas-ventanas-20261107
  pull_request:
    paths:
      - index.html
      - juego/assets/fh-structure-*.js
      - juego/assets/fh-architecture-skins.js
      - juego/assets/fh-access-editor.js
      - .github/workflows/structure-health.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis JavaScript
        run: |
          node --check juego/assets/fh-structure-health.js
          node --check juego/assets/fh-structure-editor.js
          node --check juego/assets/fh-structure-engine-hook.js
      - name: Daño, PG, guardado y motor Base64
        run: node --test juego/assets/fh-structure-health.test.js
      - name: Pruebas completas del editor y gameplay existente
        run: node --test juego/assets/*.test.js
