name: HUD del jugador — pruebas

on:
  pull_request:
    paths:
      - 'index.html'
      - 'juego/assets/fh-hud-*'
      - 'juego/assets/fh-nameplate-hud.*'
      - 'juego/assets/fh-mood-fear-ui.*'
      - 'juego/assets/fh-context-engine-hook.*'
      - 'juego/assets/fh-interaction-strings.js'
      - 'juego/assets/fh-player-menu.*'
      - 'juego/assets/fh-game-ui*'
      - 'juego/assets/fh-location-hud.*'
      - 'juego/assets/fh-mobile-camera.*'
      - 'juego/assets/fh-player-menu.*'
      - '.github/workflows/hud-ui.yml'
  push:
    branches:
      - design/hud-2026-11-06
    paths:
      - 'index.html'
      - 'juego/assets/fh-hud-*'
      - 'juego/assets/fh-game-ui*'
      - '.github/workflows/hud-ui.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar marco y ubicación
        run: |
          node juego/assets/fh-player-menu.js
          node --test juego/assets/fh-player-menu.test.js juego/assets/fh-hud-frame.test.js juego/assets/fh-game-ui.test.js juego/assets/fh-location-hud.test.js juego/assets/fh-status-hud.test.js juego/assets/fh-mobile-camera.test.js juego/assets/fh-nameplate-hud.test.js juego/assets/fh-mood-fear-ui.test.js juego/assets/fh-context-engine-hook.test.js
