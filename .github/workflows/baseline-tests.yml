name: Verificación de pruebas del motor

on:
  pull_request:
    paths:
      - 'juego/assets/fh-peephole.test.js'
      - 'juego/assets/fh-preview-boot.test.js'
      - 'juego/assets/fh-npc-goap.js'
      - 'juego/assets/fh-npc-goap.test.js'
      - 'juego/assets/fh-npc-courier.js'
      - 'juego/assets/fh-npc-courier.test.js'
      - 'juego/assets/fh-npc-doors-integration.test.js'
      - 'juego/assets/fh-npc-delivery-bridge.test.js'
      - 'juego/assets/fh-npc-preview-contract.test.js'
      - 'juego/assets/fh-terminal.html'
      - 'juego/assets/fh-delivery.js'
      - 'juego/assets/fh-delivery-strings.js'
      - 'juego/assets/fh-roads*'
      - 'index.html'
      - '.github/workflows/baseline-tests.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pruebas del motor y editor
        run: node --test juego/assets/*.test.js
