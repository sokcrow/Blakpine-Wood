name: Electricidad 03 — integración de red y generadores

on:
  pull_request:
    paths:
      - 'juego/assets/fh-exterior-*.js'
      - 'juego/assets/fh-services-core.js'
      - 'juego/assets/fh-services-engine-hook.js'
      - 'juego/assets/fh-generators.test.js'
      - 'juego/assets/fh-hamazon-availability.test.js'
      - 'juego/assets/fh-glb-bridge.test.js'
      - 'forest-horror/biblioteca/catalogo_muebles.json'
      - '.github/workflows/electricidad-03.yml'
  push:
    branches: [main]
    paths:
      - 'juego/assets/fh-exterior-*.js'
      - 'juego/assets/fh-services-core.js'
      - 'forest-horror/biblioteca/catalogo_muebles.json'
      - '.github/workflows/electricidad-03.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar motor de red exterior, batería, combustible y catálogo
        run: |
          node --test juego/assets/fh-pole-collision.test.js juego/assets/fh-exterior-grid.test.js juego/assets/fh-exterior-visuals.test.js juego/assets/fh-exterior-editor.test.js juego/assets/fh-exterior-services.test.js juego/assets/fh-generators.test.js juego/assets/fh-hamazon-availability.test.js
          node juego/assets/fh-glb-bridge.test.js
